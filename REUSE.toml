# SPDX-License-Identifier: AGPL-3.0-only
# REUSE annotations for files that cannot carry a header of their own.
version = 1

[[annotations]]
path = "scanrulerfc/icons/**"
# override: the icons' own header lines (written by tools/gen_icons.py) run a
# credit on after the licence id, which REUSE would read as part of it.
precedence = "override"
SPDX-FileCopyrightText = "Drawn from ScanRuler's key pictures by Stefan Hermann (CNC Kitchen), github.com/CNCKitchen/ScanRuler"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["scanrulerfc/fonts/barlow-*.woff2", "scanrulerfc/fonts/OFL-barlow.txt", "scanrulerfc/fonts/OFL-barlowsemicondensed.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["scanrulerfc/fonts/b612-mono-*.woff2", "scanrulerfc/fonts/OFL-b612mono.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2012 The B612 Project Authors (https://github.com/polarsys/b612)"
SPDX-License-Identifier = "OFL-1.1"

# Files that cannot carry a comment, or are read whole: the file list, the
# Addon Manager metadata, the tool and key-map data, the test fixtures,
# the hardening run's records (docs/hardening).
[[annotations]]
path = ["FILES", "package.xml", ".gitignore", "scanrulerfc/data/**", "tests/reverse_fixtures/**", "scripts/ste_originals.json", "docs/hardening/**"]
SPDX-FileCopyrightText = "ScanRuler for FreeCAD contributors; ported from ScanRuler by Stefan Hermann (CNC Kitchen), github.com/CNCKitchen/ScanRuler"
SPDX-License-Identifier = "AGPL-3.0-only"

# The privacy check, shared with Agent Link for FreeCAD under its licence.
[[annotations]]
path = [".github/privacy/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
