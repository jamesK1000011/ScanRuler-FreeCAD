# SPDX-License-Identifier: AGPL-3.0-only
# REUSE annotations for files that cannot carry a header of their own.
version = 1

[[annotations]]
path = "scanrulerfc/icons/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Drawn from ScanRuler's key pictures by Stefan Hermann (CNC Kitchen), github.com/CNCKitchen/ScanRuler"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["scanrulerfc/fonts/barlow-*.woff2", "scanrulerfc/fonts/OFL-barlow.txt", "scanrulerfc/fonts/OFL-barlowsemicondensed.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["scanrulerfc/fonts/b612-mono-*.woff2", "scanrulerfc/fonts/OFL-b612mono.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2012 The B612 Project Authors (https://github.com/polarsys/b612)"
SPDX-License-Identifier = "OFL-1.1"
